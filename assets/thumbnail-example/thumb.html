<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
* { margin:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; position:relative;
  background:url(frame.jpg) no-repeat; background-size:1264px 2246px; background-position:-92px -6px; }
.bar { background:oklch(22% .04 200 / .95); color:#fff; display:inline-block; padding:0 14px; }
.acc { color:oklch(72% .18 50); }
.eyebrow { position:absolute; left:70px; top:300px; font:800 36px/1.4 Manrope; letter-spacing:.1em; color:oklch(72% .18 50); }
.eyebrow span { background:oklch(22% .04 200 / .95); padding:2px 8px; }
.head { position:absolute; left:70px; top:368px; font:700 112px/1 'Space Grotesk'; letter-spacing:-.035em; }
.head .bar { padding:4px 14px 14px; margin-bottom:6px; }
.label { position:absolute; left:625px; top:1168px; transform:rotate(-4deg); font:800 30px/1.4 Manrope; letter-spacing:.1em; color:#fff; }
.label span { background:oklch(22% .04 200 / .95); padding:2px 10px; }
.receipt { position:absolute; left:600px; top:1205px; width:420px; filter:drop-shadow(0 30px 50px rgba(0,0,0,.45)); }
</style></head>
<body>
  <div class="eyebrow"><span>DAY 1</span></div>
  <div class="head">
    <div class="bar"><span class="acc">3-4 €</span> a month</div><br>
    <div class="bar">to run my</div><br>
    <div class="bar">flood forecast</div>
  </div>
  <div class="label"><span>MONTHLY COST</span></div>
  <img class="receipt" src="receipt.png">
</body></html>
